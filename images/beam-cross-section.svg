<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Concrete section -->
  <rect x="30" y="20" width="140" height="260" fill="#d3d3d3" stroke="#333" stroke-width="2"/>

  <!-- Reinforcement bars (top) -->
  <circle cx="60" cy="50" r="8" fill="#444" stroke="#222" stroke-width="1.5"/>
  <circle cx="140" cy="50" r="8" fill="#444" stroke="#222" stroke-width="1.5"/>

  <!-- Reinforcement bars (bottom) -->
  <circle cx="55" cy="250" r="10" fill="#444" stroke="#222" stroke-width="1.5"/>
  <circle cx="100" cy="250" r="10" fill="#444" stroke="#222" stroke-width="1.5"/>
  <circle cx="145" cy="250" r="10" fill="#444" stroke="#222" stroke-width="1.5"/>

  <!-- Stirrup -->
  <rect x="42" y="32" width="116" height="236" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6,3" rx="4"/>

  <!-- Dimension: width -->
  <line x1="30" y1="295" x2="170" y2="295" stroke="#000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="100" y="292" text-anchor="middle" font-size="12" font-family="serif">b</text>

  <!-- Dimension: height -->
  <line x1="185" y1="20" x2="185" y2="280" stroke="#000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="193" y="155" text-anchor="middle" font-size="12" font-family="serif">h</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
</svg>
