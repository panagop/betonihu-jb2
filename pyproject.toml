[project]
name = "betonihu-jb2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter-book>=2.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betonihu"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
